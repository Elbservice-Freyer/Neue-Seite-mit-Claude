<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Platzhalter fuer das Vorher-Foto">
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA9B3"/><stop offset="1" stop-color="#6E7F8C"/>
    </linearGradient>
    <pattern id="schlieren" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
      <rect width="34" height="34" fill="none"/>
      <rect width="3" height="34" fill="#FFFFFF" opacity="0.16"/>
      <rect x="14" width="1" height="34" fill="#5A6B78" opacity="0.3"/>
    </pattern>
    <pattern id="warnung" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#FFF6E0"/><rect width="13" height="26" fill="#FDEBC4"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#v)"/>
  <rect width="1200" height="600" fill="url(#schlieren)"/>
  <g opacity="0.25" fill="#3B4A56">
    <circle cx="230" cy="150" r="34"/><circle cx="880" cy="410" r="46"/><circle cx="560" cy="270" r="22"/>
    <circle cx="1020" cy="120" r="28"/><circle cx="330" cy="470" r="30"/>
  </g>
  <rect x="0" y="404" width="1200" height="64" fill="url(#warnung)"/>
  <text x="880" y="444" text-anchor="middle" font-family="ui-monospace, monospace" font-size="19" letter-spacing="2" fill="#6B4E12">PLATZHALTER: FOTO &quot;VORHER&quot;</text>
</svg>
